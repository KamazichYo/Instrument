<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Instrument</title>
  <meta name="description" content="Инструменты для монтажа: звук, видео и другое — прямо в телефоне.">
  <meta name="theme-color" content="#0e0f13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Instrument">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <main class="wrap">
    <h1 class="big-title">Инструменты</h1>
    <p class="sub">Всё обрабатывается прямо на телефоне — файлы никуда не загружаются.</p>

    <!-- Новый инструмент = новая плитка + папка со страницей -->
    <nav class="grid">
      <a class="tile" href="audio/">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg>
        </span>
        <span><b>Звук</b><small>Улучшатор голоса и вырезка пауз</small></span>
      </a>
      <a class="tile" href="subtitles/">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 15h4M13 15h5M6 11h8"/></svg>
        </span>
        <span><b>Субтитры</b><small>Русская речь → .srt для монтажа</small></span>
      </a>
      <a class="tile soon" href="#" aria-disabled="true">
        <span class="badge">скоро</span>
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/></svg>
        </span>
        <span><b>Видео</b><small>В разработке</small></span>
      </a>
    </nav>
  </main>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
