<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="mg:about" content="Шарик скачет по Бруклину: впереди — серый дождливый город, позади — живой, цветной. Граница — светящаяся нить. Масляная живопись: мазки с рельефом, импасто, холст.">
<title>Brooklyn Alive</title>
<link rel="stylesheet" href="lib/mg.css">
<style>
  #stage { background:#6f7479; }
  #out { position:absolute; left:0; top:0; width:100%; height:100%; }
</style>
</head>
<body>
<div id="stage"><canvas id="out"></canvas></div>
<script src="lib/mg.js"></script>
<script src="lib/paint.js"></script>
<script src="scene.js"></script>
<script src="actors.js"></script>
<script>
// ====== РЕДАКТИРУЙ ЗДЕСЬ ======
const P = {
  title: 'BROOKLYN',
  ballLetter: 2,                 // какая буква заголовка — шарик (индекс «O»)
  sub: 'Город, который оживает',
};
// ===============================
const comp = MG.comp({ width: W, height: H, fps: 30, duration: DURATION, bg: '#6f7479' });
const FR = PAINT.surface(W, H);
let IMP = null;

function drawLayers(mode, t, cam) {
  const Lr = LAYERS[mode];
  const sdx = -(cam.cx - 622) * 0.025;
  const zf = 1 + (cam.z - 1) * 0.35;
  const farX = W / 2 + cam.sx * 0.4 + (460 - (1500 + cam.cx * 0.22)) * zf, farY = H + cam.sy * 0.4 + (-220 - cam.yb + 60) * zf;
  // видимая часть холста мира (в пикселях холста)
  const wx0 = Math.max(0, ((-cam.ox) / cam.z - WX0) * PK - 4), wx1 = Math.min(LAYERS.alive.world.c.width, ((W - cam.ox) / cam.z - WX0) * PK + 4);
  const wy0 = Math.max(0, ((-cam.oy) / cam.z - WY0) * PK - 4), wy1 = Math.min(LAYERS.alive.world.c.height, ((H - cam.oy) / cam.z - WY0) * PK + 4);
  for (const [g, key] of [[FR.cx, 'c'], [FR.hx, 'h']]) {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(Lr.sky[key], -200 + sdx, -80, 2520, 1260);
    Lr.clouds.forEach((cl, k) => {
      const sp = mode === 'alive' ? 12 : 22, span = W + 900;
      const x = ((((k * 760 + 120 - cam.cx * 0.05 + t * sp) % span) + span) % span) - 600, y = (mode === 'alive' ? 40 : -30) + (k % 3) * 70;
      g.drawImage(cl[key], x, y, cl.w, cl.h_);
    });
    g.setTransform(zf / 0.7, 0, 0, zf / 0.7, farX, farY);
    g.drawImage(Lr.far[key], 0, 0);
    g.setTransform(cam.z / PK, 0, 0, cam.z / PK, cam.ox + WX0 * cam.z, cam.oy + WY0 * cam.z);
    g.drawImage(Lr.world[key], wx0, wy0, wx1 - wx0, wy1 - wy0, wx0, wy0, wx1 - wx0, wy1 - wy0);
  }
  MODE = mode;
  FR.cx.setTransform(cam.z, 0, 0, cam.z, cam.ox, cam.oy); FR.hx.setTransform(cam.z, 0, 0, cam.z, cam.ox, cam.oy);
  drawActors({ cx: FR.cx, hx: FR.hx }, t, cam);
  FR.cx.setTransform(1, 0, 0, 1, 0, 0); FR.hx.setTransform(1, 0, 0, 1, 0, 0);
  drawScreenFX({ cx: FR.cx, hx: FR.hx }, t, cam);
  MODE = 'alive';
}

comp.setup(async () => {
  await paintAll();
  initActors();
  IMP = PAINT.impasto(document.getElementById('out'), W, H, { relief: 1.6, spec: 0.12, weave: 0.3, vignette: 0.3 });
  initTitle(P);
  BOUNCES.forEach(([, , t], i) => comp.mark(t, 'boing', { gain: -7, pitch: [1, 1.12, 0.9, 1.05, 0.85, 1.1, 0.95, 1.15, 1.25][i] }));
  BOUNCES.forEach(([, , t, k]) => comp.mark(t + 0.005, 'thump', { gain: k > 0.9 ? -6 : -12 }));
  comp.mark(0.05, 'whoosh', { gain: -10 }).mark(8.7, 'whoosh', { gain: -8 }).mark(9.75, 'riser', { gain: -12 }).mark(LAND_T, 'impact', { gain: -3 }).mark(LAND_T + 0.05, 'sparkle', { gain: -8 });
  for (const m of ACTOR_MARKS) comp.mark(m[0], m[1], m[2]);
});

comp.onSeek((t) => {
  if (!IMP) return;
  const cam = camera(t);
  FR.cx.setTransform(1, 0, 0, 1, 0, 0); FR.hx.setTransform(1, 0, 0, 1, 0, 0);
  FR.hx.fillStyle = 'rgb(128,128,128)'; FR.hx.fillRect(0, 0, W, H);
  drawLayers('alive', t, cam);
  const th = threadAt(t, cam);
  if (th) {
    for (const g of [FR.cx, FR.hx]) {
      g.save(); g.beginPath(); th.pts.forEach((p, i) => (i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y))); g.lineTo(W + 80, H + 10); g.lineTo(W + 80, -10); g.closePath(); g.clip();
    }
    drawLayers('dull', t, cam);
    FR.cx.restore(); FR.hx.restore();
  }
  drawFX({ cx: FR.cx, hx: FR.hx }, t, cam, th);
  drawTitle({ cx: FR.cx, hx: FR.hx }, t);
  IMP.render(FR.c, FR.h);
});
</script>
</body>
</html>
