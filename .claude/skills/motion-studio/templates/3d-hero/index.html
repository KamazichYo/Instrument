<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="mg:about" content="3D герой-объект: иконка/продукт/GLB-модель падает и приземляется, облёт камеры, блики, частицы, заголовок. Свет: studio·bright·neon·sunset·noir">
<title>3D Hero</title>
<link rel="stylesheet" href="lib/mg.css">
<style>
  #stage { background:#060608; font-family:var(--sans); color:#f4f2ee; }
  .copy { position:absolute; top:50%; right:calc(var(--safeR)*1px + var(--u)*2); width:44%; transform:translateY(-50%); }
  .copy h1 { font:700 calc(var(--u)*8.4)/1.02 var(--display); letter-spacing:-0.035em; }
  .copy h1 em { font-style:normal; color:var(--accent); }
  .copy p { margin-top:calc(var(--u)*2.4); font:500 calc(var(--u)*3)/1.35 var(--sans); color:rgba(244,242,238,.68); max-width:90%; }
  .mg-portrait .copy { top:auto; bottom:calc(var(--safeB)*1px); left:calc(var(--safeL)*1px); right:calc(var(--safeR)*1px); width:auto; transform:none; text-align:center; }
  .mg-portrait .copy p { margin-left:auto; margin-right:auto; }
</style>
</head>
<body>
<div id="stage">
  <div class="copy"><h1 id="h1"></h1><p id="sub"></p></div>
</div>
<script src="lib/mg.js"></script>
<script src="lib/three/three.mg.js"></script>
<script src="lib/three/inter-display-black.font.js"></script>
<script src="lib/three/mg3d.js"></script>
<script>
// ====== РЕДАКТИРУЙ ЗДЕСЬ ======
const P = {
  look: 'studio',                 // studio · bright · neon · sunset · noir
  color: '#ff5a1f',               // цвет героя
  glyph: 'I',                     // буква/цифра на иконке (кириллица тоже)
  model: null,                    // 'assets/model.glb' — свой объект (Meshy, Spline, Blender); null — иконка
  title: 'Монтаж <em>в кармане</em>',
  sub: 'Звук, субтитры и графика — прямо в телефоне',
};
const DURATION = 7;
// ===============================
document.documentElement.style.setProperty('--accent', P.color);
document.getElementById('h1').innerHTML = P.title;
document.getElementById('sub').textContent = P.sub;

const comp = MG.comp({ format: '16:9', fps: 30, duration: DURATION });
const tl = comp.tl();
comp.setup(async () => {
  const S = MG3.stage(comp, { look: P.look, floor: { y: -1.25, shadow: 0.42 }, orbit: { yaw: -28, pitch: 9, radius: comp.portrait ? 12.5 : 9 }, target: [0, 0, 0] });
  const T = S.THREE;

  // ГЕРОЙ: своя модель или иконка — скруглённый куб + объёмная буква
  // кластер = герой + спутники: двигаются вместе, когда кадр уступает место заголовку
  const cluster = new T.Group(); S.add(cluster);
  const hero = new T.Group(); cluster.add(hero);
  if (P.model) {
    const g = await MG3.loadGLB(P.model);
    MG3.normalize(g.scene, 2.4); hero.add(g.scene);
    if (g.animations.length) S.onFrame(MG3.clips(g));
  } else {
    const body = new T.Mesh(MG3.roundedBox(2.2, 2.2, 0.62, 0.42, 8), MG3.mat.glossy(P.color, { roughness: 0.18 }));
    body.castShadow = true; hero.add(body);
    const g = MG3.text3d(P.glyph, { font: 'inter-display-black', size: 1.25, depth: 0.22, material: MG3.mat.glossy('#ffffff', { roughness: 0.1 }) });
    g.group.position.z = 0.33; hero.add(g.group);
  }
  // спутники: стекло и хром дают глубину и параллакс
  const glass = new T.Mesh(new T.SphereGeometry(0.5, 64, 32), MG3.mat.glass('#cfe6ff')); glass.position.set(1.55, 1.05, -1.3); glass.castShadow = true;
  const ring = new T.Mesh(new T.TorusGeometry(0.42, 0.13, 32, 96), MG3.mat.chrome()); ring.position.set(-1.55, -0.8, 0.75); ring.castShadow = true;
  const pill = new T.Mesh(new T.CapsuleGeometry(0.2, 0.6, 8, 24), MG3.mat.glossy('#ffc83d', { roughness: 0.3 })); pill.position.set(-1.75, 1.2, -1.1); pill.rotation.z = 0.8; pill.castShadow = true;
  cluster.add(glass, ring, pill);
  MG3.particles(S, { count: 260, color: P.look === 'bright' ? '#ffffff' : '#ffcfa8', opacity: P.look === 'bright' ? 0.3 : 0.55 });

  // 0.0–1.1 ПАДЕНИЕ: герой летит сверху с вращением, приземляется, «приседает» и выпрямляется
  tl.fromTo(hero, { y: 6, rotY: -200, rotX: 25 }, { y: 0, rotY: 0, rotX: 0 }, { at: 0.1, dur: 1.0, ease: 'land' });
  tl.fromTo(hero, { scaleY: 1 }, { scaleY: 0.86 }, { at: 0.72, dur: 0.08, ease: 'out' })
    .to(hero, { scaleY: 1 }, { at: 0.8, ease: { spring: { stiffness: 320, damping: 14 } } });
  comp.mark(0.15, 'whoosh').mark(0.74, 'impact');
  // спутники вылетают из-за героя по очереди
  [glass, ring, pill].forEach((o, i) => tl.from(o, { x: 0, y: 0, z: -2, scale: 0 }, { at: 0.85 + i * 0.1, dur: 0.9, ease: 'land' }));
  comp.mark(0.9, 'pop');
  // спутники дрейфуют — кадр живёт
  S.onFrame((t) => {
    glass.position.y = 1.05 + Math.sin(t * 1.3) * 0.12; ring.rotation.x = t * 0.9; ring.rotation.y = t * 0.5; pill.rotation.y = t * 0.7;
  });

  // КАМЕРА: облёт + наезд; блик скользит по герою, потому что контровой свет едет
  tl.to(S.orbit, { yaw: 22, pitch: 4, radius: comp.portrait ? 13 : 7.6 }, { at: 0, dur: DURATION, ease: 'glide' });
  tl.fromTo(S.rim.position, { x: -6 }, { x: 6 }, { at: 0.8, dur: 3.5, ease: 'glide' });
  // 2.4 герой уступает место заголовку
  const side = comp.portrait ? { x: 0, y: 1.1 } : { x: -2.2, y: 0.1 };
  tl.to(S.target, { x: comp.portrait ? 0 : -0.55, y: comp.portrait ? 0.6 : 0 }, { at: 2.3, dur: 1.2, ease: 'land' });
  tl.to(cluster, side, { at: 2.3, dur: 1.2, ease: 'land' });
  tl.to(hero, { rotY: 18 }, { at: 2.3, dur: 4.7, ease: 'out' });

  // ЗАГОЛОВОК (DOM поверх 3D)
  const words = MG.split('#h1', 'words');
  tl.from(words, { y: 40, opacity: 0, blur: 12 }, { at: 2.7, dur: 0.6, ease: 'land', stagger: 0.12 });
  tl.from('#sub', { y: 20, opacity: 0 }, { at: 3.3, dur: 0.6, ease: 'land' });
  comp.mark(2.7, 'swish');
});
</script>
</body>
</html>
